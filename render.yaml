# Render — service backend de l'agent IA (24h/24) + base de données intégrée
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: seo-boss-agent
    runtime: node
    rootDir: agent
    # IMPORTANT : déployer la branche qui contient le code
    # (le main du dépôt n'a que le README — sans ceci, Render build main => échec)
    # → passer sur "main" après un éventuel merge
    branch: arena/01a0ef96-seo-boss
    autoDeploy: true
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AGENT_TOKEN
        generateValue: true
      - key: SITE_URL
        value: "https://buzzafrique.vercel.app"
      # Base de données SQLite intégrée (aucun service externe).
      # Sur un plan payant Render, attacher un Disk et définir :
      #   DB_PATH=/var/data/seo-boss.db
      - key: RUN_INTERVAL_MINUTES
        value: "30"
      - key: AUTO_PUBLISH
        value: "true"
      - key: MAX_ARTICLES_PER_CYCLE
        value: "1"
      # ---- Secret à ajouter APRÈS création du service ----
      # Dashboard → seo-boss-agent → Environment → Add Environment Variable :
      #   GROQ_API_KEY = gsk_...   (LLM gratuit Llama 3.3 — qualité des articles)
