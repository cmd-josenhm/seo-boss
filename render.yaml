# Render — service backend de l'agent IA (24h/24) + base de données intégrée
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: seo-boss-agent
    runtime: node
    rootDir: agent
    branch: main
    autoDeploy: true
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    # ---------------------------------------------------------------------------
    # PERSISTANCE (fortement recommandé) — décommenter les 2 blocs ci-dessous
    # pour conserver la base SQLite entre deux redéploiements/réveils.
    # ⚠️ Un disque Render nécessite un plan payant (starter). Sans lui, la base
    # est réinitialisée à chaque redémarrage : le site reste complet grâce au
    # catalogue de secours (web/lib/seed.js) mais l'agent repart de zéro.
    # ---------------------------------------------------------------------------
    # plan: starter
    # disk:
    #   name: seo-boss-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AGENT_TOKEN
        generateValue: true
      - key: SITE_URL
        value: "https://buzzafrique.vercel.app"
      # Emplacement de la base SQLite. À passer à /var/data/seo-boss.db
      # quand le disque persistant ci-dessus est activé.
      - key: DB_PATH
        value: /opt/render/project/src/agent/data/seo-boss.db
      - key: RUN_INTERVAL_MINUTES
        value: "30"
      - key: AUTO_PUBLISH
        value: "true"
      - key: MAX_ARTICLES_PER_CYCLE
        value: "2"
      # Modèle « bibliothèque » : 0 = aucun plafond, les anciens articles sont conservés
      - key: CATALOG_MAX
        value: "0"
      # ---- Secret à ajouter APRÈS création du service ----
      # Dashboard → seo-boss-agent → Environment → Add Environment Variable :
      #   GROQ_API_KEY = gsk_...   (LLM gratuit Llama 3.3 — qualité des articles)

# -----------------------------------------------------------------------------
